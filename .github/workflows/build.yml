name: Build, Test and Release Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Test Suite
        run: ./gradlew test --stacktrace

      - name: Build Mod Jars (Fabric & Forge)
        run: ./gradlew build -x test --stacktrace

      - name: Prepare Release Artifacts & Extract Version
        id: prep
        run: |
          mkdir -p release_jars
          cp forge/build/libs/customraces-forge-*.jar release_jars/ 2>/dev/null || true
          cp fabric/build/libs/customraces-fabric-*.jar release_jars/ 2>/dev/null || true
          rm -f release_jars/*-dev-shadow.jar release_jars/*-sources.jar
          
          FORGE_JAR=$(find release_jars -maxdepth 1 -name "customraces-forge-1.20.1-*.jar" | head -n 1)
          FABRIC_JAR=$(find release_jars -maxdepth 1 -name "customraces-fabric-1.20.1-*.jar" | head -n 1)
          
          if [ -n "$FORGE_JAR" ]; then
            JAR_NAME=$(basename "$FORGE_JAR" .jar)
            VERSION_STR=$(echo "$JAR_NAME" | sed 's/customraces-forge-1.20.1-//')
            TAG_NAME="v${VERSION_STR}"
          else
            VERSION_STR="1.0.0-$(date +'%Y%m%d%H%M%S')"
            TAG_NAME="v${VERSION_STR}"
          fi
          
          FORGE_FILENAME="customraces-forge-1.20.1-${VERSION_STR}.jar"
          FABRIC_FILENAME="customraces-fabric-1.20.1-${VERSION_STR}.jar"
          
          echo "version_str=${VERSION_STR}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "forge_jar=${FORGE_JAR}" >> $GITHUB_OUTPUT
          echo "fabric_jar=${FABRIC_JAR}" >> $GITHUB_OUTPUT
          echo "forge_filename=${FORGE_FILENAME}" >> $GITHUB_OUTPUT
          echo "fabric_filename=${FABRIC_FILENAME}" >> $GITHUB_OUTPUT
          
          echo "=== RELEASE INFORMATION ==="
          echo "Version String: ${VERSION_STR}"
          echo "Release Tag: ${TAG_NAME}"
          echo "Forge JAR: ${FORGE_JAR} -> Display Name: ${FORGE_FILENAME}"
          echo "Fabric JAR: ${FABRIC_JAR} -> Display Name: ${FABRIC_FILENAME}"
          
          python3 -c "
import re
try:
    with open('CHANGELOG.md', 'r') as f:
        content = f.read()
    match = re.search(r'(## \[.*?\] - .*?)\n---', content, re.DOTALL)
    if match:
        notes = match.group(1).strip()
        with open('release_notes.txt', 'w') as out:
            out.write(notes)
        print('Extracted release notes:')
        print(notes)
    else:
        with open('release_notes.txt', 'w') as out:
            out.write('Custom Races Framework release ' + '${VERSION_STR}')
except Exception as e:
    with open('release_notes.txt', 'w') as out:
        out.write('Custom Races Framework release ' + '${VERSION_STR}')
"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-races-framework-jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            common/build/libs/*.jar
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: Custom Races Framework ${{ steps.prep.outputs.tag_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: release_jars/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Forge to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          curseforge-id: "1631130"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: ${{ steps.prep.outputs.forge_jar }}
          curseforge-display-name: ${{ steps.prep.outputs.forge_filename }}
          curseforge-name: ${{ steps.prep.outputs.forge_filename }}
          name: ${{ steps.prep.outputs.forge_filename }}
          display-name: ${{ steps.prep.outputs.forge_filename }}
          version: ${{ steps.prep.outputs.version_str }}
          version-type: release
          changelog-file: release_notes.txt
          loaders: |
            forge
            neoforge
          game-versions: |
            1.20.1
          java: |
            Java 17
            Java 21

      - name: Publish Fabric to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          curseforge-id: "1631130"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: ${{ steps.prep.outputs.fabric_jar }}
          curseforge-display-name: ${{ steps.prep.outputs.fabric_filename }}
          curseforge-name: ${{ steps.prep.outputs.fabric_filename }}
          name: ${{ steps.prep.outputs.fabric_filename }}
          display-name: ${{ steps.prep.outputs.fabric_filename }}
          version: ${{ steps.prep.outputs.version_str }}
          version-type: release
          changelog-file: release_notes.txt
          loaders: |
            fabric
            quilt
          game-versions: |
            1.20.1
          java: |
            Java 17
            Java 21
